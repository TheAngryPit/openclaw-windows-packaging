name: PR172 isolated host proof

on:
  push:
    branches: [qa/pr172-host-proof-20261011]
    paths: [.github/workflows/pr172-host-proof.yml]

permissions:
  contents: read

jobs:
  host:
    if: github.repository == 'TheAngryPit/openclaw-windows-packaging'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      PRODUCT_SHA: f0ee2298c6f23ca11e776b8c3fdf0307c79a2db7
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify product source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = git rev-parse HEAD^
          if ($LASTEXITCODE -ne 0 -or $parent -cne $env:PRODUCT_SHA) {
            throw 'QA commit is not a direct child of the pinned PR head.'
          }
          $changed = @(git diff --name-only $env:PRODUCT_SHA HEAD)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/pr172-host-proof.yml') {
            throw 'QA overlay changed product source.'
          }
          New-Item -ItemType Directory -Path TestResults -Force | Out-Null
          "product=$env:PRODUCT_SHA`nqa=$env:GITHUB_SHA`nrunner=$env:RUNNER_OS/$env:RUNNER_ARCH" |
            Out-File TestResults/source.txt -Encoding utf8
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\OpenClaw.Gateway.MSIX.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Canonical Release quality gate
        id: quality
        shell: pwsh
        run: ./scripts/Test-DotNetQuality.ps1 -Configuration Release -SkipRestore
      - name: Full Release host suite
        shell: pwsh
        run: |
          dotnet test .\OpenClaw.Gateway.MSIX.slnx --configuration Release --no-restore --blame-hang-timeout 3min --blame-hang-dump-type mini --results-directory TestResults --logger 'trx;LogFileName=host.trx'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: NativeAOT command-line proof
        if: ${{ !cancelled() && steps.quality.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/Test-NativeAotCli.Tests.ps1 -Configuration Release
      - name: MXC packaging input contract
        if: ${{ !cancelled() && steps.quality.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/Test-Get-MxcRuntime.Tests.ps1
      - name: Upload receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr172-host-proof-${{ github.run_id }}
          path: TestResults
          if-no-files-found: error
          retention-days: 7
